<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KickBack | Book gaming café sessions</title>
    <meta
      name="description"
      content="Find and book PS5, PC, VR and pool sessions at gaming cafés."
    />

    <!-- Icons: SVG for modern browsers, ICO/PNG fallbacks for the rest -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" sizes="48x48" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Dark is the default theme. A saved "light" choice is applied here, before the
         first paint, so there is no flash of the wrong theme. (lib/theme.ts keeps
         these tags in step when the user switches.) -->
    <meta name="theme-color" content="#12141A" />
    <meta name="color-scheme" content="dark" />
    <script>
      (function () {
        var theme = "dark";
        try {
          if (localStorage.getItem("kickback-theme") === "light") theme = "light";
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        if (theme === "light") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#F5F6F8");
          document.querySelector('meta[name="color-scheme"]').setAttribute("content", "light");
        }
      })();
    </script>
    <style>
      html,
      body {
        background: #12141a;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f5f6f8;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
